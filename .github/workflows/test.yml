name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.25", "1.26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: go mod download
        run: go mod download
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
      - name: upload coverage
        if: matrix.go == '1.26'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.txt

  matrix-interop:
    name: matrix interop (live Dendrite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: start an unmodified Dendrite homeserver
        run: scripts/dendrite_up.sh
      - name: measure it and drive the report through to an aggregate
        # DAP_REQUIRE_LIVE=1 turns an unreachable homeserver into a failure
        # instead of a skip, so this job cannot go green without having run.
        env:
          DAP_REQUIRE_LIVE: "1"
        run: go test ./integration/matrix/ -run TestLive -count=1 -v
      - name: homeserver logs on failure
        if: failure()
        run: docker logs dap-go-dendrite 2>&1 | tail -50
      - name: stop the homeserver
        if: always()
        run: scripts/dendrite_up.sh down

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
